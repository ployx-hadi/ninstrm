<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="Ninja Stream is coming soon. Your sports. Your stream." />
  <title>Ninja Stream — Coming Soon</title>
  <style>
    :root {
      --red: #f20d19;
      --red-dark: #a9000b;
      --white: #f8f8f8;
      --muted: #a6a6a6;
      --panel: rgba(255,255,255,.045);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--white);
      background:
        radial-gradient(ellipse at 12% 8%, rgba(242,13,25,.23), transparent 34%),
        radial-gradient(ellipse at 92% 94%, rgba(242,13,25,.18), transparent 35%),
        #050505;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 48vw;
      height: 48vw;
      max-width: 650px;
      max-height: 650px;
      border: 1px solid rgba(242,13,25,.16);
      border-radius: 50%;
      pointer-events: none;
    }
    body::before { top: -34vw; left: -20vw; box-shadow: 0 0 0 35px rgba(242,13,25,.025), 0 0 0 70px rgba(242,13,25,.02); }
    body::after { bottom: -37vw; right: -22vw; box-shadow: 0 0 0 35px rgba(242,13,25,.025), 0 0 0 70px rgba(242,13,25,.02); }
    .wrap {
      width: min(920px, calc(100% - 40px));
      padding: 64px 24px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 58px;
      font-weight: 900;
      letter-spacing: .08em;
      font-size: 18px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: white;
      background: linear-gradient(145deg, #ff2631, #a9000b);
      box-shadow: 0 5px 24px rgba(242,13,25,.28);
      font-size: 15px;
    }
    .sports {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(18px, 4vw, 42px);
      margin: 0 auto 30px;
      color: #fff;
      opacity: .9;
      font-size: clamp(25px, 5vw, 38px);
    }
    .sports span { display: inline-flex; align-items: center; gap: clamp(18px, 4vw, 42px); }
    .sports i {
      width: 1px;
      height: 28px;
      display: inline-block;
      background: rgba(255,255,255,.25);
      transform: rotate(18deg);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 14px;
      border: 1px solid rgba(242,13,25,.38);
      border-radius: 999px;
      background: rgba(242,13,25,.08);
      color: #ff7b82;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: 10px;
      font-weight: 800;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ff2631;
      box-shadow: 0 0 12px #ff2631;
      animation: pulse 1.7s infinite;
    }
    h1 {
      margin: 24px 0 14px;
      font-size: clamp(48px, 10vw, 94px);
      line-height: .98;
      letter-spacing: -.065em;
      font-weight: 950;
    }
    h1 span { color: var(--red); }
    .sub {
      max-width: 560px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.75;
    }
    .divider {
      width: 64px; height: 3px;
      margin: 30px auto;
      border-radius: 5px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
    }
    .tagline {
      color: #e7e7e7;
      font-size: 12px;
      letter-spacing: .24em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .bottom {
      margin-top: 76px;
      color: #666;
      font-size: 12px;
    }
    .bottom strong { color: #aaa; font-weight: 600; }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.78); } }
    @media (max-width: 520px) {
      .wrap { padding: 42px 12px; }
      .brand { margin-bottom: 48px; }
      .bottom { margin-top: 58px; }
      .sports { gap: 13px; }
      .sports span { gap: 13px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span class="brand-mark">▶</span><span>NINJA STREAM</span></div>

    <div class="sports" aria-label="Sports">
      <span>🏈 <i></i></span>
      <span>⚾ <i></i></span>
      <span>🏀</span>
    </div>

    <div class="eyebrow"><span class="dot"></span> Something exciting is on the way</div>
    <h1>COMING<br /><span>SOON.</span></h1>
    <p class="sub">The action is getting closer. Ninja Stream is bringing your favourite sports together in one place. Get ready for the game.</p>
    <div class="divider"></div>
    <div class="tagline">Your sports. Your stream.</div>

    <footer class="bottom">© <span id="year">2026</span> <strong>Ninja Stream</strong>. All rights reserved.</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
