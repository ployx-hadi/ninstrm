<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="Something new is coming soon. Stay tuned.">
  <title>Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    :root { --accent: #8b7cff; --text: #f7f7fb; --muted: #a5a5b3; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px; color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 18% 15%, rgba(139,124,255,.19), transparent 34%),
        radial-gradient(ellipse at 85% 85%, rgba(69,150,255,.13), transparent 32%),
        #09090b;
      overflow: hidden;
    }
    body::before, body::after {
      content: ""; position: fixed; width: 440px; height: 440px; border: 1px solid rgba(255,255,255,.07);
      border-radius: 50%; pointer-events: none;
    }
    body::before { top: -300px; right: -100px; box-shadow: 0 0 0 45px rgba(255,255,255,.018), 0 0 0 90px rgba(255,255,255,.012); }
    body::after { bottom: -330px; left: -120px; box-shadow: 0 0 0 45px rgba(255,255,255,.018), 0 0 0 90px rgba(255,255,255,.012); }
    main {
      position: relative; z-index: 1; width: min(680px, 100%); text-align: center;
      padding: clamp(38px, 8vw, 76px) clamp(22px, 6vw, 58px);
      border: 1px solid rgba(255,255,255,.1); border-radius: 28px;
      background: rgba(255,255,255,.035); backdrop-filter: blur(16px);
      box-shadow: 0 28px 100px rgba(0,0,0,.35);
    }
    .symbol {
      width: 58px; height: 58px; margin: 0 auto 34px; display: grid; place-items: center;
      border-radius: 18px; color: white; font-size: 25px;
      background: linear-gradient(145deg, #a99cff, #6655df);
      box-shadow: 0 10px 34px rgba(139,124,255,.3);
    }
    .label {
      display: inline-flex; align-items: center; gap: 9px; padding: 9px 14px;
      border: 1px solid rgba(139,124,255,.35); border-radius: 999px;
      color: #c4bcff; background: rgba(139,124,255,.09);
      font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    }
    .pulse { width: 7px; height: 7px; border-radius: 50%; background: #a99cff; box-shadow: 0 0 12px #a99cff; animation: pulse 1.8s infinite; }
    h1 { margin: 26px 0 16px; font-size: clamp(48px, 10vw, 76px); line-height: .98; letter-spacing: -.065em; font-weight: 850; }
    h1 span { color: var(--accent); }
    p { max-width: 470px; margin: 0 auto; color: var(--muted); font-size: clamp(15px, 2.5vw, 17px); line-height: 1.8; }
    .line { width: 54px; height: 3px; margin: 32px auto 0; border-radius: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
    footer { margin-top: 34px; color: #777784; font-size: 12px; }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">✦</div>
    <div class="label"><span class="pulse"></span> Something is on the way</div>
    <h1>Coming<br><span>Soon.</span></h1>
    <p>We’re working on something exciting. A fresh experience is just around the corner. Stay tuned — we’ll be here before you know it.</p>
    <div class="line"></div>
    <footer>© <span id="year">2026</span> All rights reserved.</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
